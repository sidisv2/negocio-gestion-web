<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Smartphone Outer Shell -->
  <rect x="136" y="96" width="240" height="320" rx="36" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8" />

  <!-- Screen Surface -->
  <rect x="152" y="112" width="208" height="288" rx="24" fill="#07090e" />

  <!-- Glowing Energy Lightning Bolt -->
  <path d="M272 136 L200 264 L256 264 L240 376 L312 248 L256 248 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
